<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Student Record System</h1>

        <!-- Add/Edit Form -->
        <div class="form-card">
            <h2 id="form-title">Add New Student</h2>
            <form id="student-form">
                <input type="hidden" id="edit-index" value="-1">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter student name" required>
                    </div>
                    <div class="form-group">
                        <label for="roll">Roll Number</label>
                        <input type="text" id="roll" placeholder="e.g. 101" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="student@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="e.g. 9876543210" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" required>
                            <option value="">-- Select Course --</option>
                            <option value="B.Tech CSE">B.Tech CSE</option>
                            <option value="B.Tech ECE">B.Tech ECE</option>
                            <option value="B.Tech ME">B.Tech ME</option>
                            <option value="BBA">BBA</option>
                            <option value="B.Com">B.Com</option>
                            <option value="MBA">MBA</option>
                            <option value="MCA">MCA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="marks">Marks (%)</label>
                        <input type="number" id="marks" min="0" max="100" placeholder="e.g. 85" required>
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" id="submit-btn" class="btn btn-primary">➕ Add Student</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary" style="display:none;">✖ Cancel</button>
                </div>
            </form>
        </div>

        <!-- Search & Stats -->
        <div class="toolbar">
            <input type="text" id="search" placeholder="🔍 Search by name, roll, or course...">
            <span id="stats" class="stats"></span>
        </div>

        <!-- Records Table -->
        <div class="table-card">
            <table id="student-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Roll No.</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Course</th>
                        <th>Marks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
